<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Club - Register</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Campus Cricket Club</h1>
        <p>Register for our cricket events.</p>
    </header>

    <nav>
        <a href="index.html">Home page</a>
        <a href="events.html">Event page</a>
        <a href="register.html" class="active">Register page</a>
    </nav>

    <main>

        <section>
    <h2>Register for Cricket Events</h2>

    <form id="registrationForm">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" required minlength="3">

        <label for="email">University Email:</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone"
               pattern="[0-9]{11}" required>

        

        <button type="submit">Register</button>
        <button type="clear"> delete all</button>
    </form>
</section>

    </main>

    <footer>
        <p>Contact: uniclub@example.com</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
