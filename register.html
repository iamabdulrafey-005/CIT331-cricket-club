<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Club - Register</title>
    <link rel="stylesheet" href="css/styles.css">
    
</head>

<body>

    <header>
        <h1>Campus Cricket Club</h1>
        <p>Register for our cricket events.</p>
    </header>

    <nav>
        <a href="index.html">Home page</a>
        <a href="events.html">Event page</a>
        <a href="register.html" class="active">Register page</a>
    </nav>

    <main>

        <section>
    <h2>Register for Cricket Events</h2>

    <form id="registrationForm">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" required minlength="3">

        <label for="email">University Email:</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone"
               pattern="[0-9]{11}" required>

        <label for="event">Choose an Event:</label>
                <select id="event" name="event" required>
                    <option value="">Select an event</option>
                    <option value="Indoor Cricket Tournament">Indoor Cricket Tournament - 22 November 2026</option>
                    <option value="Friendly Cricket Match">Friendly Cricket Match - 25 November 2026</option>
                    <option value="Batting and Bowling Practice">Batting and Bowling Practice - 28 November 2026</option>
                    <option value="Cricket Team Trials">Cricket Team Trials - 2 December 2026</option>
                </select>

            <fieldset>
                    <legend>How did you hear about us?</legend>

                    <label for="friend">
                        <input type="radio" id="friend" name="referral"
                               value="Friend" required>
                        Friend
                    </label>

                    <label for="notice">
                        <input type="radio" id="notice" name="referral"
                               value="University notice">
                        University notice
                    </label>

                    <label for="social">
                        <input type="radio" id="social" name="referral"
                               value="Social media">
                        Social media
                    </label>
                </fieldset>

        <button type="submit">Register</button>
        <button type="button" id="clearButton">Clear All Registrations</button>

    </form>
   <p id="message"></p>
    
</section>

<section>
            <h2>Saved Registrations</h2>
            <ul id="registrations">
                <li>No registrations yet.</li>
            </ul>
        </section>

    </main>

    <footer>
        <p>Contact: uniclub@example.com</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
